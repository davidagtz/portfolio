---
layout: page
title: "API Gateway"
permalink: /api/
hidden: true
---

<div class="api-container">
  <form id="apiForm" class="api-form">
    <div class="form-group">
      <label for="requestType">Request Type:</label>
      <select id="requestType" name="requestType">
        <option value="GET" selected>GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="DELETE">DELETE</option>
        <option value="PATCH">PATCH</option>
      </select>
    </div>

    <div class="form-group">
      <label for="requestUrl">URL:</label>
      <input type="text" id="requestUrl" name="requestUrl" value="https://www.davidgutierrez.dev" required>
    </div>

    <div class="form-group">
      <label>Query Parameters:</label>
      <div id="queryParams">
        <div class="param-row">
          <input type="text" placeholder="Key" class="param-key">
          <input type="text" placeholder="Value" class="param-value">
          <button type="button" class="remove-param">×</button>
        </div>
      </div>
      <button type="button" id="addQueryParam" class="add-param-btn">Add Query Parameter</button>
    </div>

    <div class="form-group">
      <label>Headers:</label>
      <div id="headers">
        <div class="param-row">
          <input type="text" placeholder="Key" class="header-key" value="DG-Key">
          <input type="text" placeholder="Value" class="header-value">
          <button type="button" class="remove-header">×</button>
        </div>
      </div>
      <button type="button" id="addHeader" class="add-param-btn">Add Header</button>
    </div>

    <button type="submit" class="submit-btn">Send Request</button>
  </form>

  <div class="response-container">
    <h3>Response:</h3>
    <pre id="responseOutput"></pre>
  </div>
</div>

<style>
.api-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
}

.api-form {
  background: #f5f5f5;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

.form-group input[type="text"],
.form-group select {
  width: 100%;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin-bottom: 10px;
}

.param-row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.param-row input {
  flex: 1;
}

.remove-param,
.remove-header {
  background: #ff4444;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 0 10px;
  cursor: pointer;
}

.add-param-btn {
  background: #4CAF50;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 10px;
}

.submit-btn {
  background: #2196F3;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

.response-container {
  background: #f5f5f5;
  padding: 20px;
  border-radius: 8px;
}

#responseOutput {
  background: #fff;
  padding: 15px;
  border-radius: 4px;
  overflow-x: auto;
  white-space: pre-wrap;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('apiForm');
  const queryParamsContainer = document.getElementById('queryParams');
  const headersContainer = document.getElementById('headers');
  const responseOutput = document.getElementById('responseOutput');

  // Add query parameter row
  document.getElementById('addQueryParam').addEventListener('click', () => {
    addParamRow(queryParamsContainer, 'remove-param');
  });

  // Add header row
  document.getElementById('addHeader').addEventListener('click', () => {
    addParamRow(headersContainer, 'remove-header');
  });

  // Handle form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const requestType = document.getElementById('requestType').value;
    const requestUrl = document.getElementById('requestUrl').value;
    
    // Build query parameters
    const queryParams = {};
    queryParamsContainer.querySelectorAll('.param-row').forEach(row => {
      const key = row.querySelector('.param-key').value;
      const value = row.querySelector('.param-value').value;
      if (key) queryParams[key] = value;
    });

    // Build headers
    const headers = {};
    headersContainer.querySelectorAll('.param-row').forEach(row => {
      const key = row.querySelector('.header-key').value;
      const value = row.querySelector('.header-value').value;
      if (key) headers[key] = value;
    });

    // Build URL with query parameters
    const url = new URL(requestUrl);
    Object.entries(queryParams).forEach(([key, value]) => {
      if (value) url.searchParams.append(key, value);
    });

    try {
      const response = await fetch(url.toString(), {
        method: requestType,
        headers: headers
      });

      const data = await response.text();
      responseOutput.textContent = data;
    } catch (error) {
      responseOutput.textContent = `Error: ${error.message}`;
    }
  });

  // Helper function to add parameter rows
  function addParamRow(container, removeClass) {
    const row = document.createElement('div');
    row.className = 'param-row';
    row.innerHTML = `
      <input type="text" placeholder="Key" class="param-key">
      <input type="text" placeholder="Value" class="param-value">
      <button type="button" class="${removeClass}">×</button>
    `;
    
    row.querySelector(`.${removeClass}`).addEventListener('click', () => {
      row.remove();
    });
    
    container.appendChild(row);
  }

  // Add event listeners for existing remove buttons
  document.querySelectorAll('.remove-param, .remove-header').forEach(button => {
    button.addEventListener('click', (e) => {
      e.target.parentElement.remove();
    });
  });
});
</script>
